[project]
name = "pyfolium"
version = "0.1.0"
description = "A Python backtesting library for portfolio management and trading strategies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.0.0",
    "tqdm>=4.0.0",
]

[project.scripts]
setup-dev = "pyfolium._setup:setup_dev_environment"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "pandas-stubs>=2.0.0",
    "pyright>=1.1.0",
    "types-tqdm>=4.67.0.20250809",
    "deepdiff>=6.0.0",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
]

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = "."
addopts = [
    "--cov=pyfolium.core",
    "--cov=pyfolium.strategy",
    "--cov=pyfolium.simulation",
    "--cov=pyfolium.data",
    "--cov-branch",
    "--cov-report=xml:coverage/coverage.xml",
    "--cov-report=html:coverage/",
]
testpaths = ["tests"]

# Ruff configuration - replaces black, isort, and flake8
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PTH",   # flake8-use-pathlib
]

[tool.ruff.lint.isort]
known-first-party = ["pyfolium"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pyright configuration
# python version is intentionally not hardcoded here — pyright reads .python-version
# or the active venv automatically, so CI and local always check the right version.
[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# deepdiff ships no stubs; suppress the resulting import errors
reportMissingModuleSource = "none"

# Coverage configuration
[tool.coverage.run]
branch = true
source = ["pyfolium"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[project]
name = "pyfolium"
version = "0.1.0"
description = "A Python backtesting library for portfolio management and trading strategies"
license = "MIT"
authors = [{name = "Pyfolium Contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "tqdm>=4.0.0",
]

[project.scripts]
setup-dev = "pyfolium._setup:setup_dev_environment"

[project.urls]
Homepage = "https://github.com/whnr/pyfolium"
Repository = "https://github.com/whnr/pyfolium"
Documentation = "https://whnr.github.io/pyfolium/"
Issues = "https://github.com/whnr/pyfolium/issues"

[build-system]
requires = ["uv_build>=0.7,<0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "pandas-stubs>=2.0.0",
    "pyright>=1.1.0",
    "types-tqdm>=4.67.0.20250809",
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.27",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

# Pytest configuration
[tool.pytest.ini_options]
addopts = [
    "--cov=pyfolium",
    "--cov-branch",
    "--cov-report=xml:coverage/coverage.xml",
    "--cov-report=html:coverage/",
]
testpaths = ["tests"]

# Ruff configuration - replaces black, isort, and flake8
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PTH",   # flake8-use-pathlib
]

[tool.ruff.lint.isort]
known-first-party = ["pyfolium"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pyright configuration
# python version is intentionally not hardcoded here — pyright reads .python-version
# or the active venv automatically, so CI and local always check the right version.
[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# pandas-stubs omits pd.Period from the Scalar union type, causing false
# positives on every PeriodIndex .loc[] access and arithmetic on their results.
# Demoted to warning so they remain visible but non-blocking until
# pandas-stubs resolves https://github.com/pandas-dev/pandas-stubs/issues/
reportArgumentType = "warning"
reportCallIssue = "warning"
reportOperatorIssue = "warning"
reportAttributeAccessIssue = "warning"

# Coverage configuration
[tool.coverage.run]
branch = true
source = ["pyfolium"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
